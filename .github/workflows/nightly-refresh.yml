name: Nightly zero-trial refresh

on:
  schedule:
    - cron: "15 3 * * *" # 03:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Snapshot before
        run: cp data/diseases.json /tmp/diseases.before.json

      - name: Refresh zero-trial diseases
        run: npm run refresh:zero-trials

      - name: Derive
        run: npm run derive

      - name: Guards
        run: |
          npm run assert:refresh-guards -- \
            --mode nightly \
            --before /tmp/diseases.before.json \
            --after data/diseases.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diseases.json data/refresh-log.jsonl
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: nightly zero-trial refresh"
            git push
          fi
