name: Nightly artifact refresh

on:
  schedule:
    - cron: "15 3 * * *" # 03:15 UTC
  workflow_dispatch:
    inputs:
      accuracy_batch:
        description: "Allow up to 15% noTrials move (contamination remediation)"
        required: false
        default: "false"
        type: boolean
      limit:
        description: "Max priority refetch codes (queue + contamination)"
        required: false
        default: "150"

permissions:
  contents: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Snapshot before
        run: |
          npm run artifact:ensure
          cp data/diseases.json /tmp/diseases.before.json

      - name: Nightly orchestrator
        run: |
          LIMIT="${{ github.event.inputs.limit || '150' }}"
          npm run refresh:nightly -- --limit "$LIMIT"

      - name: Guards
        run: |
          EXTRA=""
          if [[ "${{ github.event.inputs.accuracy_batch }}" == "true" ]]; then
            EXTRA="--accuracy-batch"
          fi
          npm run assert:refresh-guards -- \
            --mode nightly \
            --before /tmp/diseases.before.json \
            --after data/diseases.json \
            $EXTRA

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diseases.json.gz data/refresh-log.jsonl || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: nightly artifact refresh"
            git push
          fi
